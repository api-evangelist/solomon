name: Solomon
description: 'Solomon (Solomon AI, solomontax.ai) is an agentic AI platform for tax
  preparation aimed at accounting firms, automating the preparation of review-ready
  individual 1040 returns for high-net-worth and ultra-high-net-worth clients. The
  system interprets K-1/K-3 footnotes, applies multi-state SALT rules to K-1s, reconciles
  rental and real estate investments, analyzes brokerage statements for foreign income,
  and produces workpapers and audit trails, positioning itself to replace legacy tools
  such as SurePrep and K1x. Backed by Bessemer Venture Partners. This profile was surfaced
  as a portfolio-company lead and enriched by the API Evangelist pipeline; the company
  publishes no public developer/API surface at this time.'
